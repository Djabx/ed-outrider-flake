name: Update Upstream Flake

on:
  schedule:
    # Weekly on Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  update-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update inputs
        run: nix flake update

      - name: Check for changes
        id: check_diff
        run: |
          if git diff --quiet flake.lock; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No upstream changes found."
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "Upstream inputs updated."
          fi

      - name: Validate builds
        if: steps.check_diff.outputs.has_updates == 'true'
        run: |
          echo "Building from source package and running test suite..."
          nix build .#default --no-link

      - name: Commit and Push
        if: steps.check_diff.outputs.has_updates == 'true'
        run: |
          git add flake.lock
          git commit -m "chore(deps): weekly upstream flake update"
          git push origin main
